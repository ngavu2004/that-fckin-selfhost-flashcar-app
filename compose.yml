services:
  backend:
    build: .
    ports:
      - 8000:3001
    environment:
      - POSTGRES_HOST=localhost
      - POSTGRES_PORT=5432
  postgres:
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=postgres
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: